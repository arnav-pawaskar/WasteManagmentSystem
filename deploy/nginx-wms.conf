# Reverse proxy for the FastAPI service (uvicorn on 127.0.0.1:8000).
# Installed to /etc/nginx/sites-available/wms by deploy/setup.sh.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # The dashboard polls 5 JSON endpoints every 2 s. GCP's free tier includes only
    # 1 GB/month of egress, so compress everything text-based (JSON shrinks ~5-10x).
    gzip on;
    gzip_proxied any;
    gzip_min_length 512;
    gzip_types application/json text/css application/javascript text/plain;

    client_max_body_size 16k;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Election blocks for ~2 s; leave generous headroom
        proxy_read_timeout 30s;
    }
}
